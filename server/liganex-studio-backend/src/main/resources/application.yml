spring:
  application:
    name: liganex-studio-backend

  profiles:
    active: ${LIGANEX_PROFILE:dev}

  # 数据源：dev 默认值对应 infra/local-dev 的 docker-compose（占位口令，非生产凭证）
  datasource:
    url: ${LIGANEX_DB_URL:jdbc:postgresql://localhost:5432/liganex}
    username: ${LIGANEX_DB_USER:liganex}
    password: ${LIGANEX_DB_PASSWORD:liganex_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # Flyway 为 schema 唯一真相源（ADR-0005）；禁用 ORM 自动建表
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  # MyBatis-Plus 只管 DML，不参与建表
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    global-config:
      db-config:
        id-type: assign_id

  data:
    redis:
      host: ${LIGANEX_REDIS_HOST:localhost}
      port: ${LIGANEX_REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

  jackson:
    default-property-inclusion: non_null
    # Spring Boot 4 起使用 Jackson 3（tools.jackson.*），spring.jackson.* 的枚举键须用大写枚举名
    # （如 WRITE_DATES_AS_TIMESTAMPS）；默认已不输出时间戳，此处无需额外配置。

server:
  port: ${LIGANEX_SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway

liganex:
  security:
    jwt:
      # 真正的敏感项：无默认值，必须由环境变量/启动参数注入（ADR-0007）
      # 生成方式：openssl rand -base64 48
      secret: ${LIGANEX_JWT_SECRET:}
      issuer: liganex-studio
      access-token-ttl: ${LIGANEX_ACCESS_TTL:30m}
      refresh-token-ttl: ${LIGANEX_REFRESH_TTL:7d}
  internal:
    # 服务间调用凭证（MCP -> studio），无默认值，必须注入（ADR-0007）
    service-api-key: ${LIGANEX_INTERNAL_API_KEY:}
  open:
    # 开放平台 appsecret 加密主密钥（AES-256-GCM），base64 32 字节，必须由环境变量注入（ADR-0007）。
    # 未配置时回退到内置 dev 密钥并告警，仅限本地联调，生产必须覆盖。
    # 生成方式：openssl rand -base64 32
    app-secret-master-key: ${LIGANEX_APP_SECRET_MASTER_KEY:}
  mcp:
    # 签名时间戳有效窗口（秒），超出 ±window 视为过期
    timestamp-window-sec: ${LIGANEX_MCP_TS_WINDOW:300}
    # 单应用月度调用配额（默认），超出返回 QUOTA_EXCEEDED
    default-quota-per-month: ${LIGANEX_MCP_QUOTA:10000}
  ai:
    embedding:
      base-url: ${LIGANEX_EMBEDDING_BASE_URL:}
      api-key: ${LIGANEX_EMBEDDING_API_KEY:}
      model-name: ${LIGANEX_EMBEDDING_MODEL_NAME:}
      dimensions: ${LIGANEX_EMBEDDING_DIMENSIONS:1536}
      timeout-ms: ${LIGANEX_EMBEDDING_TIMEOUT_MS:60000}
      max-retries: ${LIGANEX_EMBEDDING_MAX_RETRIES:2}
    chat:
      base-url: ${LIGANEX_CHAT_BASE_URL:}
      api-key: ${LIGANEX_CHAT_API_KEY:}
      model-name: ${LIGANEX_CHAT_MODEL_NAME:}
      timeout-ms: ${LIGANEX_CHAT_TIMEOUT_MS:120000}
      max-retries: ${LIGANEX_CHAT_MAX_RETRIES:2}
  rag:
    index:
      backend: ${LIGANEX_RAG_INDEX_BACKEND:PGVECTOR}
      version: ${LIGANEX_RAG_INDEX_VERSION:v1}
    retrieval:
      candidate-limit: ${LIGANEX_RAG_CANDIDATE_LIMIT:20}
      final-limit: ${LIGANEX_RAG_FINAL_LIMIT:6}
      rrf-k: ${LIGANEX_RAG_RRF_K:60}
    chunk:
      parent-size: ${LIGANEX_RAG_PARENT_CHUNK_SIZE:1800}
      child-size: ${LIGANEX_RAG_CHILD_CHUNK_SIZE:500}
      child-overlap: ${LIGANEX_RAG_CHILD_CHUNK_OVERLAP:80}
    worker:
      enabled: ${LIGANEX_RAG_WORKER_ENABLED:true}
      poll-delay-ms: ${LIGANEX_RAG_WORKER_POLL_DELAY_MS:2000}
      max-attempts: ${LIGANEX_RAG_WORKER_MAX_ATTEMPTS:4}
    upload:
      max-bytes: ${LIGANEX_RAG_UPLOAD_MAX_BYTES:10485760}
      max-pdf-pages: ${LIGANEX_RAG_MAX_PDF_PAGES:200}
    memory:
      recent-message-limit: ${LIGANEX_RAG_RECENT_MESSAGE_LIMIT:16}
      summary-trigger-count: ${LIGANEX_RAG_SUMMARY_TRIGGER_COUNT:24}
      summary-source-limit: ${LIGANEX_RAG_SUMMARY_SOURCE_LIMIT:40}
  generation:
    # 图片与视频生成均走 OpenAI 兼容协议；具体模型/网关由项目配置（本段）决定，代码不绑定任何厂商
    # （不会写死 OpenAI Sora）。每个供应商固定配置 url / key / name 三项，经环境变量注入；未注入时
    # 该供应商视为「未配置」，服务层在发起任何出站调用前即拒绝（返回 503）。
    # 当前默认对齐测试网关 apihub.agnes-ai.com（Agnes AI）：url 已预填；测试时只需补 key 与 name
    # （视频 agnes-video-v2.0 / 图片 agnes-image-2.1-flash）。Agnes 专属契约（轮询路径
    # /agnesapi?video_id=、成片地址 metadata.url、图生视频字段 image、尺寸 width/height）已设为
    # 默认值，切换可灵/豆包等其它网关时在 openai 段覆盖即可，无需改代码。
    video:
      # 请求未指定供应商时使用的默认值；新增供应商后改这里即可切换
      provider: ${LIGANEX_VIDEO_PROVIDER:openai}
      openai:
        url: ${LIGANEX_VIDEO_OPENAI_URL:-https://apihub.agnes-ai.com}
        key: ${LIGANEX_VIDEO_OPENAI_KEY:}
        # 模型名由配置决定；测试填 agnes-video-v2.0
        name: ${LIGANEX_VIDEO_OPENAI_NAME:}
        query-path: /agnesapi?video_id={id}
        result-url-path: metadata.url
        image-field: image
        size-as-width-height: true
    image:
      provider: ${LIGANEX_IMAGE_PROVIDER:openai}
      openai:
        url: ${LIGANEX_IMAGE_OPENAI_URL:-https://apihub.agnes-ai.com}
        key: ${LIGANEX_IMAGE_OPENAI_KEY:}
        # 模型名由配置决定；测试填 agnes-image-2.1-flash
        name: ${LIGANEX_IMAGE_OPENAI_NAME:}
